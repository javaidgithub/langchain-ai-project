[project]
name = "langchain-ai-backend"
version = "1.0.0"
description = "FastAPI + LangGraph backend for the LangChain AI Project"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP035", "E501"]
