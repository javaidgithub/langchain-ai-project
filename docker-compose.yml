services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
